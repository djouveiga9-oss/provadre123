<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Provas DRE</title><style>
:root{--bg:#e9e1d2;--card:#f8f5ee;--ink:#292a24;--olive:#354438;--gold:#a88951;--line:#d8cfbd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Arial}header{background:#29332c;color:white;padding:20px 5vw;border-bottom:4px solid var(--gold)}main{max-width:1100px;margin:28px auto;padding:0 16px}.box{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:22px;margin-bottom:18px}h1,h2{font-family:Georgia,serif}input,button{font:inherit;padding:11px;border-radius:5px}input{border:1px solid var(--line);width:100%;max-width:360px}button{border:0;background:var(--olive);color:white;font-weight:800;cursor:pointer}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}.muted{color:#777}.hidden{display:none}.good{background:#e5efe5;border:1px solid #a8c7a8}.bad{background:#f5e6e1;border:1px solid #d9aaa3}.answer{padding:13px;border-radius:6px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><header><h1>Administração · Provas DRE</h1><div>Consulta exclusiva das provas respondidas</div></header><main><section id="login" class="box"><h2>Acesso administrativo</h2><form id="loginForm"><input id="password" type="password" placeholder="Senha de administrador" required><button>ENTRAR</button></form><p id="msg" class="muted"></p></section><section id="dash" class="hidden"><div class="box top"><div><h2>Provas recebidas</h2><p class="muted">Consulte candidatos, notas e respostas. Verde = correta; vermelho = incorreta.</p></div><div><button id="refresh">ATUALIZAR</button> <button id="logout">SAIR</button></div></div><div class="box"><div class="tablewrap"><table><thead><tr><th>Protocolo</th><th>Candidato</th><th>Discord</th><th>ID no jogo</th><th>Nota</th><th>Detalhes</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="muted">Nenhuma prova recebida.</p></div><div id="detail" class="box hidden"><div class="top"><h2 id="detailTitle">Respostas</h2><button id="close">FECHAR</button></div><div id="answers"></div></div></section></main><script>
const $=s=>document.querySelector(s);let token='',exams=[],qs=[];async function api(data){const r=await fetch('/.netlify/functions/api',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const j=await api({action:'login',password:$('#password').value});token=j.token;$('#login').classList.add('hidden');$('#dash').classList.remove('hidden');await load()}catch(x){$('#msg').textContent=x.message}};
async function load(){try{const [a,b]=await Promise.all([api({action:'exam-list'}),api({action:'exam-questions'})]);exams=a.exams||[];qs=b.questions||[];$('#empty').style.display=exams.length?'none':'block';$('#rows').innerHTML=exams.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.discordName)}</td><td>${esc(x.gameId)}</td><td><b>${x.score}/${x.total||qs.length}</b></td><td><button data-id="${esc(x.id)}">VER PROVA</button></td></tr>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id))}catch(e){alert(e.message)}}
function show(id){const x=exams.find(y=>y.id===id);if(!x)return;$('#detail').classList.remove('hidden');$('#detailTitle').textContent=`${x.name} · ${x.discordName} · ID ${x.gameId} — ${x.score}/${x.total||qs.length}`;$('#answers').innerHTML=x.answers.map((a,i)=>{const ok=a===x.correctAnswers[i],q=qs[i];return `<div class="answer ${ok?'good':'bad'}"><b>Questão ${i+1} — ${ok?'CORRETA':'INCORRETA'}</b><p>${esc(q?.question||'')}</p><p><b>Escolheu:</b> ${'ABCD'[a]}. ${esc(q?.options?.[a]||'')}</p>${ok?'':`<p><b>Resposta correta:</b> ${'ABCD'[x.correctAnswers[i]]}. ${esc(q?.options?.[x.correctAnswers[i]]||'')}</p>`}</div>`}).join('');$('#detail').scrollIntoView({behavior:'smooth'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#refresh').onclick=load;$('#logout').onclick=()=>{token='';$('#dash').classList.add('hidden');$('#login').classList.remove('hidden')};$('#close').onclick=()=>$('#detail').classList.add('hidden');
</script></body></html>
